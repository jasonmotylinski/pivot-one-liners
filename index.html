<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Galloway One-Liners — Pivot Quotes</title>
<meta name="description" content="Random Scott Galloway one-liners from the Pivot podcast. Refresh for a new quote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --fg: #f5f0e8;
    --muted: #8a857c;
    --accent: #e85d3c;
    --card: #1a1917;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .header {
    position: absolute;
    top: 2rem;
    left: 0; right: 0;
  }
  .header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .header h1 span { color: var(--accent); }
  .quote-card {
    max-width: 720px;
    animation: fadein 0.4s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .quote {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.8rem, 4.5vw, 3rem);
    line-height: 1.25;
    font-weight: 400;
    margin-bottom: 2rem;
  }
  .quote::before { content: '\201C'; color: var(--accent); }
  .quote::after  { content: '\201D'; color: var(--accent); }
  .attribution {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
  }
  .attribution strong { color: var(--fg); font-weight: 600; }
  .topic {
    display: inline-block;
    margin-bottom: 2.5rem;
    padding: 0.3rem 0.9rem;
    border: 1px solid #2e2c28;
    border-radius: 999px;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.8rem 1.8rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    font-family: 'Inter', sans-serif;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid #2e2c28;
  }
  .footer {
    position: absolute;
    bottom: 1.5rem;
    left: 0; right: 0;
    font-size: 0.75rem;
    color: #55524c;
    padding: 0 1rem;
  }
  .footer a { color: var(--muted); text-decoration: none; }
  .footer a:hover { color: var(--fg); }
  .counter { color: #55524c; font-size: 0.8rem; margin-top: 1rem; }
</style>
</head>
<body>
  <div class="header">
    <h1>Scott Galloway <span>One-Liners</span></h1>
  </div>

  <div class="quote-card">
    <div class="quote" id="quote-text"></div>
    <div class="attribution">— <strong>Scott Galloway</strong>, Pivot</div>
    <div class="topic" id="quote-topic"></div>
    <div class="actions">
      <button onclick="nextQuote()">Another ↻</button>
      <button class="secondary" onclick="shareQuote()">Share</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="footer">
    Auto-extracted from Pivot podcast transcripts (YouTube auto-captions) ·
    <a href="https://github.com/jasonmotylinski/pivot-one-liners">github</a>
  </div>

<script src="quotes.js"></script>
<script>
  let lastIndex = -1;

  function pickQuote() {
    if (QUOTES.length <= 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * QUOTES.length); } while (i === lastIndex);
    return i;
  }

  function render(i) {
    const q = QUOTES[i];
    const card = document.querySelector('.quote-card');
    card.style.animation = 'none';
    void card.offsetWidth; // restart animation
    card.style.animation = '';
    document.getElementById('quote-text').textContent = q.text;
    document.getElementById('quote-topic').textContent = q.topic;
    document.getElementById('counter').textContent = `${i + 1} / ${QUOTES.length}`;
    lastIndex = i;
  }

  function nextQuote() { render(pickQuote()); }

  async function shareQuote() {
    const q = QUOTES[lastIndex];
    const shareData = {
      text: `"${q.text}" — Scott Galloway, Pivot`
    };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch (e) {}
    } else {
      await navigator.clipboard.writeText(shareData.text);
      const btn = event.target;
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => btn.textContent = orig, 1500);
    }
  }

  // Random quote on every load/refresh
  render(pickQuote());
</script>
</body>
</html>
